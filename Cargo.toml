[package]
name = "telegram_bot_rust"
version = "0.1.0"
edition = "2021"
description = "Telegram bot: Steam manifests by AppID (teloxide)"
rust-version = "1.75"

[profile.release]
strip = true
opt-level = 3

[dependencies]
teloxide = { version = "0.12", features = ["macros", "ctrlc_handler"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
pretty_env_logger = "0.5"
regex = "1.10"
url = "2.5"
tempfile = "3.10"
reqwest = { version = "0.11", features = ["json"] }



