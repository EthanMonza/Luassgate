[package]
name = "telegram_bot_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
teloxide = { version = "0.12", features = ["macros", "ctrlc_handler"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
pretty_env_logger = "0.5"
regex = "1.10"
url = "2.5"
tempfile = "3.10"
zip = "0.6"
reqwest = { version = "0.11", features = ["json"] }



